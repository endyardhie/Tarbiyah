name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tarbiyah
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Webhook dilewati bila secret belum diisi, jadi build tetap hijau sebelum Coolify siap.
      - name: Deploy staging (Coolify)
        if: github.ref == 'refs/heads/main'
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_STAGING }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "COOLIFY_WEBHOOK_STAGING belum diisi, deploy dilewati"; exit 0; fi
          # Tampilkan jawaban Coolify (tanpa rahasia) agar penyebab gagal terlihat di log.
          code=$(curl -sS -X POST -o resp.txt -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$WEBHOOK")
          cat resp.txt; echo
          [ "$code" -lt 300 ] || { echo "Coolify menjawab HTTP $code"; exit 1; }
      - name: Deploy production (Coolify)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_PRODUCTION }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "COOLIFY_WEBHOOK_PRODUCTION belum diisi, deploy dilewati"; exit 0; fi
          # Tampilkan jawaban Coolify (tanpa rahasia) agar penyebab gagal terlihat di log.
          code=$(curl -sS -X POST -o resp.txt -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$WEBHOOK")
          cat resp.txt; echo
          [ "$code" -lt 300 ] || { echo "Coolify menjawab HTTP $code"; exit 1; }
